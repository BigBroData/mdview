[package]
name = "mdview"
version = "0.2.0"
description = "Lightweight, elegant Markdown viewer"
authors = ["BigBroData"]
license = "MIT"
edition = "2021"

[lib]
name = "mdview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "8.2.1"
percent-encoding = "2.3"

[profile.release]
# Small binary is a product requirement.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
