<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="/client.css" />
  </head>
  <body>
    <div id="tabs" class="tabs" role="tablist" aria-label="Open documents" hidden></div>
    <div class="reader">
      <nav id="toc" class="toc" aria-label="Contents" hidden></nav>
      <section id="editor" class="editor" aria-label="Editor" hidden>
        <div class="editor__bar">
          <span id="editor-state" class="editor__state"></span>
          <span class="editor__spacer"></span>
          <button id="editor-save" class="editor__button" type="button" title="Save (Ctrl+S)">Save</button>
          <button id="editor-done" class="editor__button" type="button" title="Back to reading (Ctrl+E)">Done</button>
        </div>
        <div id="editor-host" class="editor__host"></div>
      </section>
      <div id="scroller" class="scroller" tabindex="-1">
        <main id="doc" class="document" aria-live="polite"></main>
      </div>
      <nav id="outline" class="outline" aria-label="Headings" hidden></nav>
    </div>
    <search id="search" class="search" hidden></search>
    <div id="themes" class="themes" role="dialog" aria-label="Theme" tabindex="-1" hidden></div>
    <div id="status" class="status" role="status" hidden></div>
    <script type="module" src="/client.js"></script>
  </body>
</html>
